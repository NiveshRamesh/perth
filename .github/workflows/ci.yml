# Thin caller: all logic lives in NiveshRamesh/ci-templates so every service runs the
# same, centrally maintained security pipeline. Only the language settings differ.
name: CI

on:
  pull_request:
    branches: [develop, "release/**"]
  push:
    branches: [develop, "feature/**", "release/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-checks:
    if: github.event_name == 'pull_request'
    uses: NiveshRamesh/ci-templates/.github/workflows/pr-checks.yml@v1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    with:
      language: go
      test-command: go test -race -coverprofile=cover.out ./... && go tool cover -func=cover.out
      codeql-languages: '["go"]'

  # Code quality + Sonar security findings. PRs get the quality gate on new code;
  # develop / release builds keep the long-lived analysis that Sonar reports use.
  sonar:
    if: >-
      github.event_name == 'pull_request' || github.ref_name == 'develop' ||
      startsWith(github.ref_name, 'release/')
    uses: NiveshRamesh/ci-templates/.github/workflows/sonar.yml@v1
    permissions:
      contents: read
      pull-requests: read
    with:
      language: go
      test-command: go test -coverprofile=cover.out ./...
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-deploy:
    if: github.event_name != 'pull_request'
    uses: NiveshRamesh/ci-templates/.github/workflows/build-deploy.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      app-port: 8080
      health-path: /health
    secrets:
      CICD_APP_CLIENT_ID: ${{ secrets.CICD_APP_CLIENT_ID }}
      CICD_APP_PRIVATE_KEY: ${{ secrets.CICD_APP_PRIVATE_KEY }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

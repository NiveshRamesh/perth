# Dependabot: weekly update PRs, grouped to keep the number of PRs low.
# Patch updates merge themselves once all checks pass (dependabot-auto-merge.yml);
# minor and major updates wait for a human. Version updates wait 7 days after a release
# (cooldown) so a malicious or broken release can be caught first; security updates do not wait.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
      go-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      go-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]

# SonarQube Cloud project settings. The organization and project key must match what
# SonarQube Cloud shows after importing the repo (Administration -> Update key).
sonar.organization=niveshramesh
sonar.projectKey=NiveshRamesh_perth
sonar.projectName=perth

sonar.sources=.
sonar.exclusions=**/*_test.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Written by go test -coverprofile in the sonar job
sonar.go.coverage.reportPaths=cover.out
